name: Validate temporary mod catalog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source pack layout and JSON
        shell: pwsh
        run: ./scripts/validate-source-packs.ps1
      - name: Verify canonical release sizes, hashes, and archive identities
        shell: pwsh
        run: ./scripts/validate-release-assets.ps1
